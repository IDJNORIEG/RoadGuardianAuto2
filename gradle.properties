# 🚀 OPTIMIZACIONES DE GRADLE Y JVM
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8

# ✅ Soporte AndroidX y Jetifier
android.useAndroidX=true
android.enableJetifier=true

# ⚙️ Compilador Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.useFallbackStrategy=false

# 🧠 Compilación optimizada
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configureondemand=false

# ⚡️ Builds más rápidos
android.nonTransitiveRClass=true
android.enableR8.fullMode=true

# 📱 Compatibilidad
android.defaults.buildfeatures.buildconfig=true
android.defaults.buildfeatures.viewbinding=true
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.compose=false

# 🔧 Recursos
android.aaptOptions.noCompress=tflite

# 🛠️ Workers
org.gradle.workers.max=2