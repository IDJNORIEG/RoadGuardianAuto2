# 🚀 OPTIMIZACIONES DE GRADLE Y JVM
kotlin.daemon.jvmargs=-Xmx2048m
org.gradle.jvmargs=-Xmx4096m
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError

# ✅ Soporte AndroidX y Jetifier (para compatibilidad con bibliotecas antiguas)
android.useAndroidX=true
android.enableJetifier=true

# ⚙️ Compilador Kotlin
kotlin.code.style=official
kotlin.incremental=true

# 🧠 Compilación optimizada
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=true

# ⚡️ Soporte para builds más rápidos
android.nonTransitiveRClass=true
android.enableR8.fullMode=true

# 📱 Modo de compatibilidad con TensorFlow Lite
android.aaptOptions.noCompress=tflite
android.defaults.buildfeatures.buildconfig=true

# 🌍 Asegurar codificación multilenguaje
org.gradle.configureondemand=true
org.gradle.workers.max=4

# 🧩 Compatibilidad con Android Studio / VSCode
android.defaults.buildfeatures.viewbinding=true
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.compose=false

# 🔧 Activar build reproducible
android.experimental.enableNewResourceShrinker=true
android.experimental.r8.retraceMappingFile=true
